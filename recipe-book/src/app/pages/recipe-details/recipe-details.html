<div *ngIf="recipe">
  <h2>{{ recipe.name }}</h2>
  <img [src]="recipe.imageUrl">

  <p>{{ recipe.description }}</p>

  <h3>Ingredients</h3>
  <ul>
    <li *ngFor="let i of recipe.ingredients">{{ i }}</li>
  </ul>

  <h3>Steps</h3>
  <ol>
    <li *ngFor="let s of recipe.steps">{{ s }}</li>
  </ol>
</div>
